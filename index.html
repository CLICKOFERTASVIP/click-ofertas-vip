<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Home - Loja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        h2 {
            color: #333;
        }
        .carousel-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .feed-horizontal {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 15px;
            padding: 10px 0;
            width: 100%;
        }
        .feed-horizontal::-webkit-scrollbar {
            display: none;
        }
        .product-card {
            min-width: 200px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .scroll-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Loja</h1>
        <nav id="megaMenu"></nav>
    </header>

    <div class="container">
        <!-- Mais Vendidos da Semana (Carrossel) -->
        <section>
            <h2>Mais Vendidos da Semana</h2>
            <div class="carousel-container">
                <button class="scroll-btn" onclick="scrollCarousel(-1)">&#10094;</button>
                <div id="maisVendidosFeed" class="feed-horizontal"></div>
                <button class="scroll-btn" onclick="scrollCarousel(1)">&#10095;</button>
            </div>
        </section>

        <!-- Destaques do Dia (Feed Geral) -->
        <section>
            <h2>Destaques do Dia</h2>
            <div id="homeFeed" class="feed-horizontal" style="flex-wrap: wrap;"></div>
        </section>
    </div>

    <script>
        // Banco de dados simulado de produtos
        const productsDatabase = [
            { id: 1, name: "Produto Exemplo 1", price: "R$ 49,90", maisVendido: true },
            { id: 2, name: "Produto Exemplo 2", price: "R$ 89,90", maisVendido: true },
            { id: 3, name: "Produto Exemplo 3", price: "R$ 129,90", maisVendido: false },
            { id: 4, name: "Produto Exemplo 4", price: "R$ 35,00", maisVendido: true },
            { id: 5, name: "Produto Exemplo 5", price: "R$ 199,90", maisVendido: false }
        ];

        function buildMegaMenu() {
            const menu = document.getElementById('megaMenu');
            if (menu) {
                menu.innerHTML = "<p>Início | Categorias | Ofertas | Contato</p>";
            }
        }

        function renderFeed(containerId, products) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = "";
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>${product.price}</p>
                `;
                container.appendChild(card);
            });
        }

        function renderMaisVendidosCarousel() {
            const container = document.getElementById('maisVendidosFeed');
            if (!container) return;

            let maisVendidos = productsDatabase.filter(p => p.maisVendido);
            
            // Segurança caso não haja produtos marcados
            if (maisVendidos.length === 0) {
                maisVendidos = productsDatabase.slice(0, 4);
            }

            container.innerHTML = "";
            maisVendidos.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>${product.price}</p>
                `;
                container.appendChild(card);
            });
        }

        function scrollCarousel(direction) {
            const container = document.getElementById('maisVendidosFeed');
            if (container) {
                const scrollAmount = 300 * direction;
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // Inicialização ao carregar a página
        window.onload = function() {
            buildMegaMenu();
            renderMaisVendidosCarousel();
            renderFeed('homeFeed', productsDatabase);
        };
    </script>
</body>
</html>
